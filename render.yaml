databases:
  - name: focusroom-db
    databaseName: focusroom
    plan: free

services:
  - type: web
    name: focus-room
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: focusroom-db
          property: connectionString
